<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JavaScript 基础练习</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 20px; }
    pre { background:#f5f5f5; padding:10px; border-radius:6px }
    .output { margin-top:12px; padding:10px; background:#fafafa; border:1px solid #eee }
  </style>
</head>
<body>
  <h1>JavaScript 基础练习</h1>

  <p>打开浏览器控制台（F12 → Console）查看输出，也可在页面上与示例交互。</p>

  <button id="btnTypes">演示变量与类型</button>
  <button id="btnFlow">演示流程控制</button>
  <button id="btnFn">演示函数与表达式</button>

  <div class="output" id="output">输出区域</div>

  <pre id="codeSample">// 这里包含部分示例代码，点击按钮触发对应演示</pre>

  <script>
    // 变量的定义（var / let / const）
    function demoTypes() {
      console.clear();
      // var（函数作用域/可重复声明）
      var a = 1;
      var a = 2; // 允许重新声明
      console.log('var a =', a);

      // let（块级作用域，不能重复声明）
      let b = 3;
      console.log('let b =', b);

      // const（常量，需立即赋值，不能重新赋值）
      const PI = 3.14159;
      console.log('const PI =', PI);

      // 基本类型和值类型示例
      const n = 42; // Number
      const s = '文本'; // String
      const t = true; // Boolean
      const nothing = null; // Null
      let undef; // undefined
      const obj = { x: 1 }; // Object
      console.log('types:', typeof n, typeof s, typeof t, typeof nothing, typeof undef, typeof obj);

      // 输出到页面
      document.getElementById('output').textContent = '查看控制台：变量与类型示例已打印。';
    }

    // 表达式与流程控制
    function demoFlow() {
      console.clear();
      const score = Math.floor(Math.random() * 101); // 0-100
      console.log('随机分数 =', score);

      // if / else if / else
      if (score >= 90) {
        console.log('等级：A');
      } else if (score >= 80) {
        console.log('等级：B');
      } else if (score >= 60) {
        console.log('等级：C');
      } else {
        console.log('等级：D');
      }

      // 三元表达式
      const pass = score >= 60 ? '通过' : '不通过';
      console.log('通过状态 =', pass);

      // for 循环与数组
      const arr = [1,2,3];
      for (let i = 0; i < arr.length; i++) {
        console.log('arr[' + i + '] =', arr[i]);
      }

      document.getElementById('output').textContent = `随机分数 ${score}，控制台查看详情`;
    }

    // 函数、返回值与高阶函数
    function demoFunctions() {
      console.clear();

      // 普通函数
      function sum(x, y) { return x + y; }
      console.log('sum(2,3)=', sum(2,3));

      // 箭头函数
      const mul = (x, y) => x * y;
      console.log('mul(4,5)=', mul(4,5));

      // 高阶函数（返回函数）
      function makeAdder(a) {
        return function(b) { return a + b; };
      }
      const add10 = makeAdder(10);
      console.log('add10(7)=', add10(7));

      // 立即执行表达式
      const msg = (function(name){ return 'Hello, ' + name; })('学生');
      console.log(msg);

      document.getElementById('output').textContent = '查看控制台：函数示例已打印。';
    }

    // 简易交互：点击按钮触发演示
    document.getElementById('btnTypes').addEventListener('click', demoTypes);
    document.getElementById('btnFlow').addEventListener('click', demoFlow);
    document.getElementById('btnFn').addEventListener('click', demoFunctions);

    // 显示示例代码片段
    document.getElementById('codeSample').textContent = `// var / let / const\nvar a = 1; let b = 2; const PI = 3.14;\n\n// if / for / 三元运算\nif (score >= 60) { console.log('通过'); }\n\n// 函数\nfunction sum(x,y){ return x+y }`;
  </script>
</body>
</html>
